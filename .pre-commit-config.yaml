# 本地 hook 统一走 uv run，保证每个人跑的是锁定的工具版本。
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: arch-checker
        name: arch_checker
        entry: uv run python lint/arch_checker.py
        language: system
        pass_filenames: false
        always_run: true
